<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>領収書</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink:#1c1c1e; --muted:#6b6b70; --line:#d8d8dc; --accent:#1f5eff; --bg:#f3f4f6; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; color:var(--ink); background:var(--bg); }
  .app { display:grid; grid-template-columns:340px 1fr; min-height:100vh; }
  body.viewer .app { display:block; }
  body.viewer form, body.viewer #qrPanel { display:none !important; }
  body:not(.viewer) #viewerBar { display:none; }
  form { background:#fff; border-right:1px solid var(--line); padding:20px; overflow:auto; }
  form h1 { font-size:18px; margin:0 0 4px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:14px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { margin-top:16px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.sub { background:#e8eaef; color:var(--ink); }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .stage { padding:24px; overflow:auto; }
  #qrPanel { max-width:210mm; margin:0 auto 18px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; display:none; align-items:center; gap:20px; }
  #qrPanel b { font-size:15px; }
  #qrCanvas img, #qrCanvas canvas { display:block; }
  #viewerBar { max-width:210mm; margin:0 auto 12px; display:flex; gap:8px; align-items:center; padding:12px 12px 0; }
  #viewerBar button { margin:0; width:auto; padding:10px 16px; }
  #viewerBar span { font-size:12px; color:var(--muted); }
  .paper { width:210mm; min-height:148mm; margin:0 auto; background:#fff; padding:16mm 16mm 12mm; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  .top { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .title { text-align:center; font-size:30px; letter-spacing:.6em; margin:10px 0 18px; font-weight:600; }
  .to { display:flex; align-items:baseline; border-bottom:1.5px solid var(--ink); padding-bottom:4px; font-size:20px; }
  .to span.sama { margin-left:auto; font-size:16px; }
  .amount { margin:18px 0 6px; display:flex; align-items:center; justify-content:center; gap:14px; background:#f6f7f9; border:1px solid var(--ink); padding:12px; }
  .amount b { font-size:32px; letter-spacing:.04em; }
  .amount small { font-size:12px; color:var(--muted); }
  .tadashi { margin:14px 0; font-size:14px; }
  .tadashi u { text-underline-offset:4px; }
  .tax { width:60%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .tax td { border:1px solid var(--line); padding:4px 8px; }
  .tax td:last-child { text-align:right; }
  .issuer { margin-top:22px; font-size:13px; line-height:1.7; }
  .issuer .name { font-size:16px; font-weight:600; }
  .histhead { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; font-size:14px; }
  .histhead span { font-size:12px; color:var(--muted); }
  #hist { margin-top:8px; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  #hist:empty::before { content:"まだ発行していません"; display:block; padding:14px; font-size:12px; color:var(--muted); }
  .h { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; width:100%; margin:0; padding:9px 10px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:#fff; color:var(--ink); font:inherit; font-size:13px; font-weight:400; text-align:left; }
  .h:last-child { border-bottom:0; }
  .h .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .h .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .h .a { font-variant-numeric:tabular-nums; font-weight:600; }
  .h small { display:block; color:var(--muted); font-size:11px; font-weight:400; }
  @media (max-width:800px) {
    .app { display:block; }
    form { border-right:0; border-bottom:1px solid var(--line); }
    input, select { font-size:16px; }
    .stage { padding:12px 8px; }
    #qrPanel { flex-wrap:wrap; justify-content:center; text-align:center; }
    #qrCanvas { margin:0 auto; }
  }
  @media (max-width:800px) {
    body.viewer .paper { width:auto; min-height:0; margin:0 10px; padding:26px 20px 28px; zoom:1 !important; }
    body.viewer .title { font-size:20px; letter-spacing:.45em; margin:6px 0 14px; }
    body.viewer .to { font-size:16px; }
    body.viewer .amount { padding:14px 8px; gap:8px; flex-wrap:wrap; }
    body.viewer .amount b { font-size:24px; }
    body.viewer .tadashi { font-size:13px; line-height:1.8; }
    body.viewer .tax { width:100%; font-size:12px; }
    body.viewer .issuer { font-size:12px; }
    body.viewer .issuer .name { font-size:14px; }
    body.viewer #viewerBar { padding:12px 10px 0; }
    body.viewer #viewerBar button { padding:9px 14px; font-size:14px; white-space:nowrap; }
    body.viewer #viewerBar span { font-size:11px; }
  }
  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; }
    .app { display:block; }
    form, #qrPanel, #viewerBar { display:none !important; }
    .stage { padding:0; }
    .paper { box-shadow:none; margin:0; zoom:1 !important; }
  }
</style>
</head>
<body>
<div class="app">
  <form id="f">
    <h1>領収書メーカー</h1>
    <div class="hint">入力 → 「QRを発行」→ お客様に読み取ってもらう</div>
    <label>宛名(空欄なら「上様」)</label><input name="to" value="">
    <div class="row">
      <div><label>金額(円)</label><input name="amount" type="number" inputmode="numeric" value=""></div>
      <div><label>金額の種類</label><select name="incl"><option value="1">税込</option><option value="0">税抜</option></select></div>
    </div>
    <label>消費税率</label>
    <select name="rate"><option value="10">10%</option><option value="8">8%(軽減)</option><option value="0">非課税・不課税</option></select>
    <label>但し書き</label><input name="memo" value="商品代">
    <label>支払方法</label>
    <select name="pay"><option value="現金">現金</option><option value="クレジットカード">クレジットカード</option></select>
    <label>発行日</label><input name="date" type="date">
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0 4px">
    <div class="hint">↓ 発行者情報は一度入れるとこの端末に記憶されます</div>
    <label>発行者名</label><input name="issuer" value="株式会社dots">
    <label>住所</label><input name="addr" value="大阪府大阪市西区新町1-30-9サンライズマンション1F">
    <div class="row">
      <div><label>電話</label><input name="tel" value="072-981-9177"></div>
      <div><label>登録番号(T+13桁)</label><input name="reg" value="T8120001207830" placeholder="T1234567890123"></div>
    </div>
    <label>スプレッドシート連携URL(任意)</label>
    <input name="gas" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="hint" id="syncState">未設定の場合は、この端末の履歴にだけ残ります。</div>
    <button type="button" class="sub" id="btnSync" hidden>未送信を今すぐ送る</button>
    <label>公開URL(このファイルを置いたURL)</label>
    <input name="base" placeholder="https://〇〇.netlify.app/">
    <div class="hint">ネット上に置いたこのファイルのURL。置いたページから開いた場合は自動で入ります。</div>
    <button type="button" id="btnQr">QRを発行</button>
    <button type="button" class="sub" id="btnNext">次の領収書へ(金額クリア)</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:22px 0 4px">
    <div class="histhead"><b>発行履歴</b><span id="histSum"></span></div>
    <div id="hist"></div>
    <div class="row">
      <button type="button" class="sub" id="btnCsv">CSVで保存</button>
      <button type="button" class="sub" id="btnClear">履歴を消す</button>
    </div>
    <button type="button" class="sub" id="btnAll">履歴をスプレッドシートに全件送る</button>
    <div class="hint">履歴はこの端末のブラウザにだけ残ります。端末を変えると別の履歴になります。</div>
  </form>

  <div class="stage">
    <div id="viewerBar">
      <button type="button" onclick="window.print()">PDFで保存</button>
      <span>画面のスクリーンショットでも保存できます</span>
    </div>
    <div id="qrPanel">
      <div id="qrCanvas"></div>
      <div>
        <b>お客様にこのQRを読み取ってもらってください</b>
        <div class="hint" id="qrNote"></div>
        <button type="button" id="btnShare">この領収書のリンクを送る(LINE・メールなど)</button>
        <div class="hint" id="shareNote">QRを読み取れない方や、後日お送りするときに使います。</div>
      </div>
    </div>
    <div class="paper" id="paper">
      <div class="top"><span></span><span id="vDate"></span></div>
      <div class="title">領収書</div>
      <div class="to"><span id="vTo"></span><span class="sama">様</span></div>
      <div class="amount"><b id="vAmount"></b><small id="vIncl"></small></div>
      <div class="tadashi">但し <u id="vMemo"></u> として、上記正に領収いたしました。</div>
      <table class="tax">
        <tr><td id="vRateLabel"></td><td id="vBase"></td></tr>
        <tr><td>消費税額</td><td id="vTax"></td></tr>
        <tr id="rowPay"><td>お支払い方法</td><td id="vPay"></td></tr>
      </table>
      <div class="issuer">
        <div class="name" id="vIssuer"></div>
        <div id="vAddr"></div>
        <div id="vTel"></div>
        <div id="vReg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const f = document.getElementById('f');
const $ = id => document.getElementById(id);
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const KEYS = ['to','amount','incl','rate','memo','date','issuer','addr','tel','reg','pay'];
const SAVED = ['issuer','addr','tel','reg','base','memo','rate','incl','gas'];
const mem = {};  // 保存が使えない環境(シークレットモード等)では、ページを開いている間だけ記憶
const ls = {
  get:k=>{ try { const x = localStorage.getItem(k); return x !== null ? x : (k in mem ? mem[k] : null); } catch(e) { return k in mem ? mem[k] : null; } },
  set:(k,v)=>{ mem[k] = v; try { localStorage.setItem(k, v); } catch(e) {} }
};

// --- 圧縮せずJSON→base64url(日本語対応) ---
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const dec = s => { s=s.replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(s); const b=Uint8Array.from(bin,c=>c.charCodeAt(0)); return JSON.parse(new TextDecoder().decode(b)); };

function calc(v) {
  const amt = Number(v.amount) || 0, rate = Number(v.rate), incl = String(v.incl) === '1';
  let total, base, tax;
  if (incl) { total = amt; base = Math.round(amt / (1 + rate/100)); tax = total - base; }
  else      { base = amt;  tax = Math.floor(amt * rate/100); total = base + tax; }
  return { total, base, tax, rate };
}
function show(v) {
  const { total, base, tax, rate } = calc(v);
  const d = v.date ? new Date(v.date + 'T00:00:00') : null;
  $('vDate').textContent = d ? `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日` : '';
  $('vTo').textContent = v.to || '上様';
  document.querySelector('.sama').textContent = v.to ? '様' : '';
  $('vAmount').textContent = yen(total) + ' -';
  $('vIncl').textContent = rate ? '(税込)' : '';
  $('vMemo').textContent = '　' + (v.memo||'').replace(/として$/,'') + '　';
  $('vRateLabel').textContent = rate ? `${rate}%対象(税抜)` : '非課税・不課税';
  $('vBase').textContent = yen(base);
  $('vTax').textContent = yen(tax);
  $('vPay').textContent = v.pay || '';
  $('rowPay').hidden = !v.pay;
  $('vIssuer').textContent = v.issuer || '';
  $('vAddr').textContent = v.addr || '';
  $('vTel').textContent = v.tel ? 'TEL ' + v.tel : '';
  $('vReg').textContent = v.reg ? '登録番号 ' + v.reg : '';
}
const formVals = () => Object.fromEntries(new FormData(f));

// --- スマホ表示: 用紙を画面幅に合わせて縮小 ---
function fit() {
  const p = $('paper'), st = document.querySelector('.stage');
  p.style.zoom = 1;
  const w = p.offsetWidth;
  const avail = st.clientWidth - (document.body.classList.contains('viewer') ? 16 : 16);
  p.style.zoom = Math.min(1, avail / w);
}
window.addEventListener('resize', fit);

// --- お客様側(QR読み取り後) ---
if (location.hash.startsWith('#r=')) {
  try {
    document.body.classList.add('viewer');
    document.title = '領収書';
    show(dec(location.hash.slice(3)));
    document.querySelector('.stage').style.padding = '8px 0 24px';
    fit();
  } catch (e) {
    document.body.classList.remove('viewer');
    alert('領収書データを読み取れませんでした');
  }
}

// --- こちら側(入力) ---
if (!document.body.classList.contains('viewer')) {
  f.date.value = new Date().toISOString().slice(0,10);
  SAVED.forEach(k => { const x = ls.get('rc_'+k); if (x) f[k].value = x; });
  if (/^https?:/.test(location.protocol) && !f.base.value) f.base.value = location.origin + location.pathname;
  // 設定用リンク: ?gas=<連携URL> 付きで開くと、連携URLをこの端末に記憶して、アドレスから消す
  try {
    const g = new URLSearchParams(location.search).get('gas');
    if (g && /^https:\/\/script\.google\.com\//.test(g)) {
      f.gas.value = g; ls.set('rc_gas', g);
      history.replaceState(null, '', location.pathname + location.hash);
    }
  } catch (e) {}
  f.addEventListener('input', () => { SAVED.forEach(k => ls.set('rc_'+k, f[k].value)); show(formVals()); });
  show(formVals()); fit();

  let lastUrl = '';
  $('btnShare').onclick = async () => {
    if (!lastUrl) return;
    try {
      if (navigator.share) { await navigator.share({ title: '領収書', text: '領収書をお送りします', url: lastUrl }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(lastUrl); $('shareNote').textContent = 'リンクをコピーしました。LINEやメールに貼り付けて送れます。'; }
    catch (e) { prompt('このリンクをコピーして送ってください', lastUrl); }
  };
  const drawQr = (data, base) => {
    const url = base.split('#')[0] + '#r=' + enc(data);
    const box = $('qrCanvas'); box.innerHTML = '';
    new QRCode(box, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
    $('qrNote').textContent = '読み取ると領収書が表示されます。';
    lastUrl = url; $('shareNote').textContent = 'QRを読み取れない方や、後日お送りするときに使います。';
    $('qrPanel').style.display = 'flex';
    $('qrPanel').scrollIntoView({behavior:'smooth'});
  };

  // スプレッドシート送信: 未送信をキューに溜め、送れたものから消す(電波が弱くても失われない)
  const loadQ = () => { try { return JSON.parse(ls.get('rc_queue') || '[]'); } catch (e) { return []; } };
  const saveQ = q => ls.set('rc_queue', JSON.stringify(q));
  const deviceId = (() => { let d = ls.get('rc_dev'); if (!d) { d = Math.random().toString(36).slice(2, 6); ls.set('rc_dev', d); } return d; })();
  const newRid = () => Date.now().toString(36) + '-' + deviceId;
  let curRid = newRid();
  const ridOf = e => e.rid || `${e.data.date}-${e.data.no}-${deviceId}`; // 旧データ用
  const payloadOf = (data, at, rid) => {
    const c = calc(data), d = new Date(at), z = n => String(n).padStart(2, '0');
    return { id: rid,
      at: `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`,
      date: data.date, to: data.to, memo: String(data.memo||'').replace(/として$/,''),
      total: c.total, base: c.base, tax: c.tax, rate: c.rate,
      pay: data.pay || '', issuer: data.issuer };
  };
  const setSync = (msg, bad) => { $('syncState').textContent = msg; $('syncState').style.color = bad ? '#c0392b' : ''; };
  const refreshSync = () => {
    const n = loadQ().length;
    $('btnSync').hidden = !(n && f.gas.value);
    if (!f.gas.value) setSync('未設定の場合は、この端末の履歴にだけ残ります。');
    else if (n) setSync(`未送信が${n}件あります。` + (lastErr ? `(原因: ${lastErr})` : '電波のあるところで送ってください。'), true);
    else setSync('スプレッドシートに記録します(送信済み)。');
  };
  let flushing = false, lastErr = '';
  async function flush() {
    const url = f.gas.value.trim();
    if (!url || flushing) return refreshSync();
    flushing = true; lastErr = ''; setSync('スプレッドシートに送信中…');
    try {
      let q = loadQ();
      while (q.length) {
        const res = await fetch(url, { method:'POST', body: JSON.stringify(q[0]) }); // text/plainで送る(事前確認なし)
        const j = await res.json();
        if (!j.ok) throw new Error(j.error || 'error');
        q = loadQ().filter(x => x.id !== q[0].id); saveQ(q);
      }
    } catch (e) { lastErr = String(e && e.message || e); } // 圏外・URL違いなどは未送信のまま残す
    flushing = false; refreshSync();
  }
  const enqueue = p => { saveQ(loadQ().filter(x => x.id !== p.id).concat(p)); flush(); };
  $('btnSync').onclick = flush;
  f.gas.addEventListener('change', () => { refreshSync(); flush(); });
  window.addEventListener('online', flush);

  // 発行履歴(この端末のみ)
  const loadHist = () => { try { return JSON.parse(ls.get('rc_hist') || '[]'); } catch (e) { return []; } };
  const saveHist = h => ls.set('rc_hist', JSON.stringify(h));
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtT = ts => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  function renderHist() {
    const h = loadHist();
    $('hist').innerHTML = h.slice().reverse().map((e, i) =>
      `<button type="button" class="h" data-i="${h.length-1-i}"><span class="n">${fmtT(e.at)}</span><span class="t">${esc(e.data.to || '上様')}<small>${esc(e.data.pay||'')} ${esc(e.data.memo||'')}</small></span><span class="a">${yen(calc(e.data).total)}</span></button>`).join('');
    const sum = h.reduce((t, e) => t + calc(e.data).total, 0);
    $('histSum').textContent = h.length ? `${h.length}件 / 合計 ${yen(sum)}` : '';
  }
  $('hist').onclick = ev => {
    const b = ev.target.closest('.h'); if (!b) return;
    const e = loadHist()[Number(b.dataset.i)];
    if (!e || !f.base.value) return;
    drawQr(e.data, f.base.value);
  };

  $('btnQr').onclick = () => {
    const v = formVals();
    if (!(Number(v.amount) > 0)) return alert('金額を入れてください');
    if (!v.base) return alert('「公開URL」を入れてください(ネット上に置いたこのファイルのURL)');
    const data = {}; KEYS.forEach(k => data[k] = v[k]);
    drawQr(data, v.base);
    // 同じ領収書の再発行は上書き(重複しない)。「次の領収書へ」で新しい領収書になる
    const h = loadHist().filter(e => ridOf(e) !== curRid);
    const at = Date.now();
    h.push({ at, rid: curRid, data }); saveHist(h); renderHist();
    if (f.gas.value) enqueue(payloadOf(data, at, curRid));
  };

  $('btnCsv').onclick = () => {
    const h = loadHist(); if (!h.length) return alert('履歴がありません');
    const q = t => '"' + String(t ?? '').replace(/"/g, '""') + '"';
    const rows = [['発行日','発行時刻','宛名','金額(税込)','消費税額','税率','支払方法','但し書き'].map(q).join(',')];
    h.forEach(e => { const c = calc(e.data), d = new Date(e.at);
      rows.push([e.data.date, d.toLocaleTimeString('ja-JP'), e.data.to || '上様', c.total, c.tax, c.rate + '%', e.data.pay || '', e.data.memo].map(q).join(',')); });
    const blob = new Blob(['\ufeff' + rows.join('\r\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = '領収書履歴_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
  };
  $('btnAll').onclick = () => {
    if (!f.gas.value) return alert('先に「スプレッドシート連携URL」を入れてください');
    const h = loadHist(); if (!h.length) return alert('履歴がありません');
    h.forEach(e => { const p = payloadOf(e.data, e.at, ridOf(e)); saveQ(loadQ().filter(x => x.id !== p.id).concat(p)); });
    flush();
  };
  $('btnClear').onclick = () => {
    if (!loadHist().length) return;
    if (confirm('発行履歴を全部消します。CSVで保存済みですか?')) { saveHist([]); renderHist(); }
  };
  renderHist(); refreshSync(); flush();

  $('btnNext').onclick = () => {
    f.amount.value = ''; f.to.value = '';
    curRid = newRid();
    $('qrPanel').style.display = 'none';
    show(formVals());
  };
}
</script>
</body>
</html>
